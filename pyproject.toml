[project]
name = "docx2hwpx-app"
version = "0.1.0"
description = "Word(.docx)를 한글(.hwpx)로 바꾸는 윈도우 프로그램 (python-hwpx 7 기반)"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["python-hwpx==7.0.1", "lxml>=5", "pillow>=10", "tkinterdnd2>=0.4"]

[project.scripts]
docx2hwpx = "docx2hwpx.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
